<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 Student Marks Calculator</h1>

        <div class="input-box">

            <div class="box">
                <label>Subject 1</label>
                <input type="number" id="sub1" placeholder="Enter Marks">
            </div>

            <div class="box">
                <label>Subject 2</label>
                <input type="number" id="sub2" placeholder="Enter Marks">
            </div>

            <div class="box">
                <label>Subject 3</label>
                <input type="number" id="sub3" placeholder="Enter Marks">
            </div>

            <div class="box">
                <label>Subject 4</label>
                <input type="number" id="sub4" placeholder="Enter Marks">
            </div>

            <div class="box">
                <label>Subject 5</label>
                <input type="number" id="sub5" placeholder="Enter Marks">
            </div>

        </div>

        <button type="button" onclick="calculateMarks()">
            Calculate Result
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
